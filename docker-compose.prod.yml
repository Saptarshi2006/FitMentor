services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://fitmentor:fitmentor123@fitmentor-db.czgo408gk3ra.ap-south-2.rds.amazonaws.com/fitmentor?sslmode=require}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      RUST_LOG: ${RUST_LOG:-info}
      INGEST_URL: http://ws:8080
      PORT: ${PORT:-3000}
      APP_URL: ${APP_URL:-https://fitmentor-7lx.pages.dev}
      API_URL: ${API_URL:-https://16-112-132-239.sslip.io}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-10112875ad4b991b430e4a8ed79124a7}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-1529070006346711182}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      API_SHARED_SECRET: ${API_SHARED_SECRET:-f09f11011bc34820d552d63b608dbc3cc587a74c74b682e66f2423d4598e620d}
      SUPERMEMORY_API_KEY: ${SUPERMEMORY_API_KEY:-}
      POLAR_ACCESS_TOKEN: ${POLAR_ACCESS_TOKEN:-}
      POLAR_WEBHOOK_SECRET: ${POLAR_WEBHOOK_SECRET:-}
      POLAR_PREMIUM_PRODUCT_ID: ${POLAR_PREMIUM_PRODUCT_ID:-}
      POLAR_PREMIUM_PRICE_ID: ${POLAR_PREMIUM_PRICE_ID:-}
      POLAR_PRO_PRODUCT_ID: ${POLAR_PRO_PRODUCT_ID:-}
      POLAR_PRO_PRICE_ID: ${POLAR_PRO_PRICE_ID:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      RDS_ENDPOINT: ${RDS_ENDPOINT:-}
      ELASTICACHE_ENDPOINT: ${ELASTICACHE_ENDPOINT:-}
    restart: unless-stopped
    depends_on:
      - redis

  ws:
    build:
      context: apps/ws
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      REDIS_URL: redis://redis:6379
      SUPERMEMORY_API_KEY: ${SUPERMEMORY_API_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-postgres://fitmentor:fitmentor123@fitmentor-db.czgo408gk3ra.ap-south-2.rds.amazonaws.com/fitmentor?sslmode=require}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_REGION: ${R2_REGION:-auto}
      R2_HOST: ${R2_HOST:-}
      API_SHARED_SECRET: ${API_SHARED_SECRET:-f09f11011bc34820d552d63b608dbc3cc587a74c74b682e66f2423d4598e620d}
    restart: unless-stopped

  planner:
    build:
      context: .
      dockerfile: microservices/daily-planner/Dockerfile
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      AI_WORKER_URL: ${AI_WORKER_URL:-https://fitmentor-7lx.pages.dev/api/ai/complete}
      API_SHARED_SECRET: ${API_SHARED_SECRET:-f09f11011bc34820d552d63b608dbc3cc587a74c74b682e66f2423d4598e620d}
      PORT: "8002"
      MODE: "http"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
